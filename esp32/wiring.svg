<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">
  <title>ESP32 entrance gate wiring: HC-SR04, voltage divider, servo, external 5 V supply</title>
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#0f172a">Smart Parking entrance gate · ESP32 wiring</text>
  <text x="30" y="58" fill="#475569">Lines that cross without a dot are not connected. Dots are joints.</text>

  <!-- ===== wires (drawn first, parts on top) ===== -->
  <g fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- TRIG: HC-SR04 -> GPIO 26 -->
    <path d="M710 160 V190 H300" stroke="#16a34a"/>
    <!-- ECHO: HC-SR04 -> R1 (1 kΩ) -> node -> GPIO 27 -->
    <path d="M780 160 V250 H632" stroke="#2563eb"/>
    <path d="M568 250 H300" stroke="#2563eb"/>
    <!-- R2 (2 kΩ): node -> GND rail -->
    <path d="M470 250 V268" stroke="#2563eb"/>
    <path d="M470 322 V600" stroke="#111827"/>
    <!-- servo signal: GPIO 18 -> servo -->
    <path d="M300 320 H560 V400 H700" stroke="#f97316"/>
    <!-- ESP32 GND -> GND rail (common ground) -->
    <path d="M300 380 H370 V600" stroke="#111827"/>
    <!-- HC-SR04 VCC -> +5 V rail -->
    <path d="M640 160 V570" stroke="#dc2626"/>
    <!-- HC-SR04 GND -> around the right -> GND rail -->
    <path d="M850 160 V178 H940 V600" stroke="#111827"/>
    <!-- servo + and - -->
    <path d="M700 430 H676 V570" stroke="#dc2626"/>
    <path d="M700 460 H692 V600" stroke="#111827"/>
    <!-- capacitor leads -->
    <path d="M800 570 V580" stroke="#dc2626"/>
    <path d="M800 590 V600" stroke="#111827"/>
    <!-- rails -->
    <path d="M300 570 H940" stroke="#dc2626" stroke-width="5"/>
    <path d="M300 600 H940" stroke="#111827" stroke-width="5"/>
  </g>
  <text x="900" y="564" text-anchor="end" font-weight="700" fill="#dc2626">+5 V rail</text>
  <text x="900" y="620" text-anchor="end" font-weight="700" fill="#111827">GND rail (common ground)</text>

  <!-- junction dots -->
  <g fill="#111827">
    <circle cx="470" cy="250" r="5" fill="#2563eb"/>
    <circle cx="470" cy="600" r="5"/><circle cx="370" cy="600" r="5"/><circle cx="692" cy="600" r="5"/>
    <circle cx="940" cy="600" r="5"/><circle cx="800" cy="600" r="5"/>
    <circle cx="640" cy="570" r="5" fill="#dc2626"/><circle cx="676" cy="570" r="5" fill="#dc2626"/><circle cx="800" cy="570" r="5" fill="#dc2626"/>
  </g>

  <!-- ===== resistors ===== -->
  <g>
    <rect x="568" y="240" width="64" height="20" rx="4" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
    <text x="600" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">R1 1 kΩ</text>
    <rect x="460" y="268" width="20" height="54" rx="4" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
    <text x="488" y="292" font-size="11" font-weight="700" fill="#78350f">R2</text>
    <text x="488" y="306" font-size="11" font-weight="700" fill="#78350f">2 kΩ</text>
  </g>
  <g>
    <rect x="392" y="132" width="200" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="402" y="150" font-size="12" font-weight="700" fill="#1e3a8a">Voltage divider on ECHO</text>
    <text x="402" y="167" font-size="12" fill="#1e3a8a">5 V × 2k / (1k + 2k) = 3.3 V</text>
  </g>

  <!-- ===== capacitor ===== -->
  <g>
    <line x1="786" y1="580" x2="814" y2="580" stroke="#111827" stroke-width="3"/>
    <line x1="786" y1="590" x2="814" y2="590" stroke="#111827" stroke-width="3"/>
    <text x="820" y="589" font-size="11" fill="#334155">470–1000 µF</text>
  </g>

  <!-- ===== ESP32 DevKit ===== -->
  <g>
    <rect x="60" y="110" width="240" height="320" rx="12" fill="#1f3b57"/>
    <rect x="110" y="150" width="120" height="96" rx="6" fill="#94a3b8"/>
    <text x="170" y="196" text-anchor="middle" font-weight="700" fill="#0f172a">ESP32</text>
    <text x="170" y="214" text-anchor="middle" font-size="11" fill="#0f172a">WROOM-32</text>
    <text x="170" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ESP32 DevKit</text>
    <text x="170" y="300" text-anchor="middle" font-size="11" fill="#cbd5e1">3.3 V logic · Wi-Fi</text>
    <rect x="36" y="330" width="34" height="44" rx="4" fill="#64748b"/>
    <text x="78" y="356" font-size="11" fill="#cbd5e1">◀ USB: power + upload</text>
    <g fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="end">
      <text x="282" y="194">GPIO 26</text>
      <text x="282" y="254">GPIO 27</text>
      <text x="282" y="324">GPIO 18</text>
      <text x="282" y="384">GND</text>
    </g>
    <g fill="#fbbf24"><rect x="294" y="184" width="12" height="12" rx="2"/><rect x="294" y="244" width="12" height="12" rx="2"/><rect x="294" y="314" width="12" height="12" rx="2"/><rect x="294" y="374" width="12" height="12" rx="2"/></g>
  </g>

  <!-- ===== HC-SR04 ===== -->
  <g>
    <rect x="600" y="76" width="290" height="76" rx="8" fill="#2f6fbf"/>
    <circle cx="680" cy="114" r="26" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
    <circle cx="810" cy="114" r="26" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
    <text x="745" y="98" text-anchor="middle" font-weight="700" fill="#ffffff">HC-SR04</text>
    <text x="745" y="114" text-anchor="middle" font-size="11" fill="#dbeafe">5 V sensor</text>
    <g fill="#fbbf24"><rect x="634" y="150" width="12" height="12" rx="2"/><rect x="704" y="150" width="12" height="12" rx="2"/><rect x="774" y="150" width="12" height="12" rx="2"/><rect x="844" y="150" width="12" height="12" rx="2"/></g>
    <g font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">
      <text x="640" y="72">VCC</text><text x="710" y="72">TRIG</text><text x="780" y="72">ECHO</text><text x="850" y="72">GND</text>
    </g>
  </g>

  <!-- ===== servo ===== -->
  <g>
    <text x="700" y="370" font-weight="700" fill="#0f172a">Servo · SG90 / MG996R</text>
    <rect x="700" y="380" width="190" height="100" rx="8" fill="#334155"/>
    <circle cx="852" cy="432" r="22" fill="#f8fafc"/>
    <rect x="842" y="388" width="20" height="52" rx="8" fill="#f8fafc"/>
    <g fill="#fbbf24"><rect x="694" y="394" width="12" height="12" rx="2"/><rect x="694" y="424" width="12" height="12" rx="2"/><rect x="694" y="454" width="12" height="12" rx="2"/></g>
    <g font-size="11" font-weight="700" fill="#ffffff">
      <text x="714" y="404">SIGNAL · orange</text>
      <text x="714" y="434">+5 V · red</text>
      <text x="714" y="464">GND · brown</text>
    </g>
  </g>

  <!-- ===== external supply ===== -->
  <g>
    <rect x="60" y="540" width="240" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="72" y="566" font-weight="700" fill="#991b1b">External 5 V regulated supply</text>
    <text x="72" y="584" font-size="11" fill="#7f1d1d">SG90: 5 V, 1 A or more</text>
    <text x="72" y="600" font-size="11" fill="#7f1d1d">MG996R: 5–6 V, 3 A or more</text>
    <text x="284" y="574" text-anchor="end" font-size="12" font-weight="700" fill="#dc2626">+</text>
    <text x="284" y="612" text-anchor="end" font-size="12" font-weight="700" fill="#111827">−</text>
  </g>

  <!-- ===== notes ===== -->
  <g font-size="11.5" fill="#334155">
    <text x="30" y="456" font-weight="700" fill="#0f172a">Rules</text>
    <text x="30" y="473">• Servo power: external supply only, never the ESP32.</text>
    <text x="30" y="489">• Join every GND: ESP32, sensor, servo, supply −.</text>
    <text x="30" y="505">• ECHO goes through R1/R2, never straight to a pin.</text>
    <text x="30" y="521">• Optional: 2nd HC-SR04 on GPIO 32/33, stop button 25.</text>
  </g>
</svg>
